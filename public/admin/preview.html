<!doctype html>
<html lang="es-ES">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vista previa del giro</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<script src="/js/theme-mode.js"></script>
<link rel="stylesheet" href="/css/fonts.css">
<link rel="stylesheet" href="/theme.css">
<link rel="stylesheet" href="/css/main.css">
<script type="importmap">
{ "imports": {
  "three": "/vendor/three/build/three.module.min.js",
  "three/addons/": "/vendor/three/examples/jsm/"
} }
</script>
<style>
  body { padding: 1rem; }
  .pv-bar { display: flex; align-items: center; justify-content: space-between; gap: 1rem; flex-wrap: wrap; margin-bottom: 1rem; }
  .pv-bar p { font-size: .85rem; color: var(--text-muted); }
  .pv-modes { display: flex; gap: .4rem; }
  .pv-grid { display: grid; grid-template-columns: minmax(0, 340px) minmax(0, 1fr); gap: 1.5rem; align-items: start; }
  .pv-label { font-size: .78rem; font-weight: 500; color: var(--text-muted); margin-bottom: .5rem; }
  .pv-grid .product-card { min-height: 22em; }
  .pv-detail .detail-visual { aspect-ratio: 1; border: var(--stroke) solid var(--ink); border-radius: var(--r-lg); overflow: hidden; max-width: 420px; }
  .pv-empty { padding: 3rem 1rem; text-align: center; color: var(--text-muted); font-size: .9rem; }
  @media (max-width: 720px) { .pv-grid { grid-template-columns: 1fr; } }
</style>
</head>
<body>
  <div class="pv-bar">
    <p id="pvInfo">Generando fotos de ejemplo…</p>
    <div class="pv-modes">
      <button class="tag-btn" id="pvMine" type="button">tus fotos</button>
      <button class="tag-btn" id="pvDemo" type="button">ejemplo</button>
    </div>
  </div>
  <div class="pv-grid">
    <div>
      <p class="pv-label">Tarjeta del catálogo · pasa el ratón por encima</p>
      <div id="pvCard"></div>
    </div>
    <div class="pv-detail">
      <p class="pv-label">Ficha del producto · arrastra la imagen o pulsa las miniaturas</p>
      <div id="pvDetail" class="detail-media"></div>
    </div>
  </div>

<script src="/js/data.js"></script>
<script src="/js/turntable.js"></script>
<script>
  const Preview = {
    mine: { name: 'Tu producto', price: 0, frames: {} },
    demo: null,
    mode: 'demo',

    product() {
      const src = this.mode === 'mine' ? this.mine : this.demo;
      return src ? { name: src.name, price: src.price, media: { ...src.frames } } : null;
    },

    render() {
      const p = this.product();
      const card = document.getElementById('pvCard');
      const detail = document.getElementById('pvDetail');
      const count = Object.keys(this.mine.frames).length;

      document.getElementById('pvMine').classList.toggle('active', this.mode === 'mine');
      document.getElementById('pvDemo').classList.toggle('active', this.mode === 'demo');
      document.getElementById('pvMine').disabled = count === 0;
      document.getElementById('pvInfo').textContent = this.mode === 'mine'
        ? `Mostrando tus fotos (${count}/4)${count < 4 ? ' · faltan lados: el giro salta al más cercano' : ''}`
        : (this.demo ? `Fotos de ejemplo generadas por ordenador${count ? '' : ' · sube las 4 fotos para ver las tuyas'}` : 'Generando fotos de ejemplo…');

      const frames = p ? Turntable.frames(p) : [];
      if (!frames.length) {
        card.innerHTML = detail.innerHTML = '<div class="pv-empty">Sin fotos todavía</div>';
        return;
      }

      card.innerHTML = `
        <article class="product-card has-photos">
          <div class="card-art">${Turntable.framesHtml(p, true)}</div>
          <div class="card-top">${frames.length > 1 ? '<span class="card-chip">360°</span>' : ''}<span class="card-chip">vista previa</span></div>
          <div class="card-bottom">
            <div><p class="product-name">${Turntable.esc(p.name)}</p><p class="product-price">${p.price > 0 ? formatPrice(p.price) : 'a consultar'}</p></div>
            <button class="btn-add" type="button">pedir</button>
          </div>
        </article>`;
      const article = card.querySelector('.product-card');
      Turntable.bindHover(article, article.querySelector('.card-art'));

      const first = frames.includes('front') ? 'front' : frames[0];
      detail.innerHTML = `
        <div class="detail-visual turntable-stage${frames.length > 1 ? ' can-drag' : ''}" id="pvStage">
          ${Turntable.framesHtml(p, true)}
          ${frames.length > 1 ? '<span class="drag-hint">arrastra para girar</span>' : ''}
        </div>
        <div class="view-switch">${frames.map(s => `
          <button class="view-thumb${s === first ? ' active' : ''}" data-slot="${s}" type="button">
            <img src="${Turntable.esc(p.media[s])}" alt=""><span>${Turntable.LABEL[s]}</span></button>`).join('')}
        </div>`;
      const stage = document.getElementById('pvStage');
      const setSlot = Turntable.bindDrag(stage);
      const thumbs = [...detail.querySelectorAll('.view-thumb')];
      stage.addEventListener('turntable:slot', e => thumbs.forEach(t => t.classList.toggle('active', t.dataset.slot === e.detail)));
      thumbs.forEach(t => t.addEventListener('click', () => setSlot(t.dataset.slot)));
    },
  };

  document.getElementById('pvMine').addEventListener('click', () => { Preview.mode = 'mine'; Preview.render(); });
  document.getElementById('pvDemo').addEventListener('click', () => { Preview.mode = 'demo'; Preview.render(); });

  // the admin product modal sends the current (possibly unsaved) photos
  window.addEventListener('message', e => {
    if (e.origin !== location.origin || !e.data || e.data.type !== 'turntable-frames') return;
    const frames = {};
    for (const s of Turntable.SLOTS) if (typeof e.data.frames[s] === 'string') frames[s] = e.data.frames[s];
    Preview.mine = { name: e.data.name || 'Tu producto', price: Number(e.data.price) || 0, frames };
    Preview.mode = Object.keys(frames).length ? 'mine' : 'demo';
    Preview.render();
  });
  Preview.render();
  if (window.parent !== window) window.parent.postMessage({ type: 'turntable-preview-ready' }, location.origin);
</script>

<script type="module">
  import * as THREE from 'three';

  // a small figure with a different detail on each side, rendered from 4 angles like a photo turntable
  function buildFigure() {
    const g = new THREE.Group();
    const mat = c => new THREE.MeshStandardMaterial({ color: c, roughness: 0.6, metalness: 0.05 });
    const box = (w, h, d, c, x, y, z) => { const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat(c)); m.position.set(x, y, z); g.add(m); return m; };

    box(0.28, 0.7, 0.32, '#3A3A38', -0.2, 0.35, 0);          // legs
    box(0.28, 0.7, 0.32, '#3A3A38', 0.2, 0.35, 0);
    box(0.9, 0.95, 0.55, '#E07A2E', 0, 1.18, 0);             // body
    box(0.25, 0.8, 0.28, '#E07A2E', -0.6, 1.2, 0);           // arms
    box(0.25, 0.8, 0.28, '#E07A2E', 0.6, 1.2, 0);
    const head = new THREE.Mesh(new THREE.SphereGeometry(0.42, 48, 32), mat('#F2E6D0'));
    head.position.set(0, 2.0, 0); g.add(head);
    box(0.6, 0.16, 0.12, '#1A1A1A', 0, 2.05, 0.36);          // visor: front
    box(0.34, 0.08, 0.04, '#E9E6DE', 0, 1.3, 0.29);          // chest stripe: front
    box(0.7, 0.75, 0.3, '#2F6B3A', 0, 1.25, -0.42);          // backpack: back
    box(0.08, 1.1, 0.08, '#9C9A94', 0.62, 1.55, 0.3);        // sword: viewer's right
    box(0.3, 0.06, 0.12, '#55534E', 0.62, 1.05, 0.3);
    const shield = new THREE.Mesh(new THREE.CylinderGeometry(0.38, 0.38, 0.08, 40), mat('#B42318'));
    shield.rotation.z = Math.PI / 2; shield.position.set(-0.8, 1.2, 0); g.add(shield);   // shield: viewer's left

    const shadow = new THREE.Mesh(new THREE.CircleGeometry(0.9, 48),
      new THREE.MeshBasicMaterial({ color: '#000000', transparent: true, opacity: 0.08 }));
    shadow.rotation.x = -Math.PI / 2; shadow.position.y = 0.002; g.add(shadow);
    return g;
  }

  function renderDemoFrames() {
    const size = 900;
    const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
    renderer.setPixelRatio(1);
    renderer.setSize(size, size, false);
    renderer.outputColorSpace = THREE.SRGBColorSpace;

    const scene = new THREE.Scene();
    scene.background = new THREE.Color('#F4F3EF');
    scene.add(new THREE.HemisphereLight(0xffffff, 0x8a877f, 1.4));
    const key = new THREE.DirectionalLight(0xffffff, 1.6);
    key.position.set(2, 4, 3);
    scene.add(key);

    const figure = buildFigure();
    scene.add(figure);
    const camera = new THREE.PerspectiveCamera(30, 1, 0.1, 50);
    camera.position.set(0, 1.6, 6.4);
    camera.lookAt(0, 1.15, 0);

    // fixed camera and light, rotating figure — like photographing on a turntable
    const rotations = { front: 0, right: -Math.PI / 2, back: Math.PI, left: Math.PI / 2 };
    const frames = {};
    for (const [slot, rot] of Object.entries(rotations)) {
      figure.rotation.y = rot;
      renderer.render(scene, camera);
      frames[slot] = renderer.domElement.toDataURL('image/webp', 0.9);
    }
    renderer.dispose();
    return frames;
  }

  try {
    Preview.demo = { name: 'Figura de ejemplo', price: 25, frames: renderDemoFrames() };
  } catch (err) {
    document.getElementById('pvInfo').textContent = 'No se pudieron generar las fotos de ejemplo en este navegador.';
  }
  Preview.render();
</script>
</body>
</html>
