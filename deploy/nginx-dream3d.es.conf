# /etc/nginx/sites-available/dream3d.es  (enlace en sites-enabled)
# Independiente del bloque de Jellyfin (amasijo.duckdns.org): no lo modifica.
# Después de activarlo, `certbot --nginx -d dream3d.es -d www.dream3d.es --redirect`
# añade el certificado, el listen 443 y la redirección http → https sobre este mismo archivo.

server {
    listen 80;
    listen [::]:80;
    server_name dream3d.es www.dream3d.es;

    # fotos de 10 MB y STL de hasta 50 MB desde el admin
    client_max_body_size 55m;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain application/xml;

    server_tokens off;
    # HSTS: add `add_header Strict-Transport-Security "max-age=31536000" always;` after certbot has https working
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
